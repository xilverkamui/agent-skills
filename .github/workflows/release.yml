name: Release zips

# Publishes a GitHub Release with one ready-to-upload zip per skill.
#
# - Push to main that changes skills/, shared/ or third-party/: a date tag
#   (vYYYY.MM.DD, then .2, .3 on the same day) is created automatically.
# - "Run workflow" button (Actions tab): same thing, on demand.
# - Pushing a v* tag by hand still works; the zips are added to its release.
on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "shared/**"
      - "third-party/**"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/bundle.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            DATE=$(TZ=Asia/Jakarta date +%Y.%m.%d)
            TAG="v$DATE"
            n=1
            while gh release view "$TAG" >/dev/null 2>&1 || [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; do
              n=$((n+1))
              TAG="v$DATE.$n"
            done
          fi
          echo "Release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
